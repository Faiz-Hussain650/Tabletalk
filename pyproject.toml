[project]
name = "tabletalk"
version = "0.1.0"
description = "A local voice ordering agent for restaurants: Whisper + Ollama + Kokoro + MCP, with evals and MLX fine-tuning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "ollama>=0.5",
    "mcp>=1.2",
    "numpy>=1.26",
]

[dependency-groups]
# Voice: Mac (Apple Silicon) only for mlx-whisper.
voice = [
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "kokoro-onnx>=0.4",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "silero-vad>=5.1",
]
# Fine-tuning + experiment tracking: Mac only for mlx-lm.
ml = [
    "mlx-lm>=0.19; sys_platform == 'darwin'",
    "mlflow>=2.12",
]
evals = [
    "jiwer>=3.0",
    "mlflow>=2.12",
]
tracing = [
    "langfuse>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[tool.uv]
# `uv sync` installs everything on your Mac. CI on Linux uses: uv sync --no-default-groups --group dev
default-groups = ["dev", "voice", "ml", "evals", "tracing"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
